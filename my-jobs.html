<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>KG Job Finder | My Jobs</title>

    <link rel="stylesheet"
          href="my-jobs.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>


<body>


<main class="my-jobs-page">


    <!--==================================================
    HEADER
    ==================================================-->

    <header class="top-bar">

        <div class="logo">

            <h1>KG</h1>

            <span data-translate="brand.jobFinder">
                JOB FINDER
            </span>

        </div>


        <a href="employer-dashboard.html"
           class="back-btn">

            <i class="fa-solid fa-arrow-left"></i>

            <span data-translate="common.dashboard">
                Dashboard
            </span>

        </a>

    </header>


    <!--==================================================
    PAGE HEADING
    ==================================================-->

    <section class="page-heading">

        <h2 data-translate="myJobs.title">
            My Jobs
        </h2>

        <p data-translate="myJobs.description">
            Manage the jobs you have published.
        </p>

    </section>


    <!--==================================================
    JOBS
    ==================================================-->

    <section
            class="jobs-container"
            id="myJobsContainer">

        <div class="loading-message">

            <i class="fa-solid fa-spinner fa-spin"></i>

            <p data-translate="myJobs.loading">
                Loading your jobs...
            </p>

        </div>

    </section>


</main>


<!--==================================================
GLOBAL TRANSLATION SYSTEM
==================================================-->

<script
        type="module"
        src="translations.js">
</script>


<!--==================================================
MY JOBS FUNCTIONALITY
==================================================-->

<script
        type="module"
        src="my-jobs.js">
</script>


</body>

</html>
