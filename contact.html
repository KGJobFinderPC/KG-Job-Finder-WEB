<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KG Job Finder | Contact Us</title>

    <link rel="stylesheet" href="contact.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<div class="background-glow glow-left"></div>
<div class="background-glow glow-right"></div>

<main class="contact-page">

    <section class="contact-card">

        <div class="contact-logo">
            <div class="logo-emblem">
                <i class="fa-solid fa-crown"></i>
                <span>KG</span>
            </div>

            <div class="logo-text">
                <strong>JOB FINDER</strong>
                <small>FIND YOUR FUTURE</small>
            </div>
        </div>

        <div class="contact-heading">

                <span class="heading-label">
                    <i class="fa-solid fa-headset"></i>
                    SUPPORT
                </span>

            <h1>Contact Us</h1>

            <p>
                Need help with KG Job Finder?
                Send us a message and our team will get back to you.
            </p>

        </div>

        <form id="contactForm">

            <div class="input-group">

                <label for="name">
                    Name
                </label>

                <div class="input-box">

                    <i class="fa-solid fa-user"></i>

                    <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Your name"
                            required
                    >

                </div>

            </div>


            <div class="input-group">

                <label for="email">
                    Email Address
                </label>

                <div class="input-box">

                    <i class="fa-solid fa-envelope"></i>

                    <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Your email address"
                            required
                    >

                </div>

            </div>


            <div class="input-group">

                <label for="subject">
                    Subject
                </label>

                <div class="input-box">

                    <i class="fa-solid fa-circle-question"></i>

                    <input
                            type="text"
                            id="subject"
                            name="subject"
                            placeholder="How can we help?"
                            required
                    >

                </div>

            </div>


            <div class="input-group">

                <label for="message">
                    Message
                </label>

                <div class="input-box textarea-box">

                    <i class="fa-solid fa-message"></i>

                    <textarea
                            id="message"
                            name="message"
                            placeholder="Tell us what happened or how we can help..."
                            required
                    ></textarea>

                </div>

            </div>


            <button
                    type="submit"
                    class="send-button"
            >

                <span>Send Message</span>

                <i class="fa-solid fa-paper-plane"></i>

            </button>

        </form>


        <div class="back-login">

            <a href="login.html">

                <i class="fa-solid fa-arrow-left"></i>

                Back to Login

            </a>

        </div>


        <div class="contact-footer">

            <span></span>

            <small>
                KG JOB FINDER
            </small>

            <span></span>

        </div>

    </section>

</main>


<script type="module" src="contact.js"></script>
</body>
</html>
