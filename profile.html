<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>KG Job Finder | My Profile</title>

    <link rel="stylesheet"
          href="profile.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>


<body>


<div class="overlay"></div>


<header class="top-bar">

    <div class="logo">

        <h1>KG</h1>

        <span data-translate="brand.jobFinder">
            JOB FINDER
        </span>

    </div>


    <a href="#"
       id="dashboardButton"
       class="back-btn">

        <i class="fa-solid fa-arrow-left"></i>

        <span data-translate="common.dashboard">
            Dashboard
        </span>

    </a>

</header>


<section class="page-title">

    <h2 data-translate="profile.title">
        My Profile
    </h2>

    <p data-translate="profile.description">
        Manage your personal information and account details.
    </p>

</section>


<section class="profile-container">

    <form id="profileForm">


        <div class="input-group">

            <label for="fullName"
                   data-translate="profile.fullName">

                Full Name

            </label>

            <input
                    type="text"
                    id="fullName"
                    data-translate-placeholder="profile.fullNamePlaceholder"
                    placeholder="Enter your full name"
                    required>

        </div>


        <div class="input-group">

            <label for="email"
                   data-translate="profile.email">

                Email Address

            </label>

            <input
                    type="email"
                    id="email"
                    data-translate-placeholder="profile.emailPlaceholder"
                    placeholder="Enter your email address"
                    required>

        </div>


        <div class="input-group">

            <label for="phone"
                   data-translate="profile.phone">

                Phone Number

            </label>

            <input
                    type="tel"
                    id="phone"
                    data-translate-placeholder="profile.phonePlaceholder"
                    placeholder="Enter your phone number">

        </div>


        <div class="input-group">

            <label for="city"
                   data-translate="profile.city">

                City

            </label>

            <input
                    type="text"
                    id="city"
                    data-translate-placeholder="profile.cityPlaceholder"
                    placeholder="Enter your city">

        </div>


        <div class="input-group">

            <label for="country"
                   data-translate="profile.country">

                Country

            </label>

            <input
                    type="text"
                    id="country"
                    data-translate-placeholder="profile.countryPlaceholder"
                    placeholder="Enter your country">

        </div>


        <div class="input-group">

            <label for="birthDate"
                   data-translate="profile.birthDate">

                Date of Birth

            </label>

            <input
                    type="date"
                    id="birthDate">

        </div>


        <div class="input-group">

            <label for="bio"
                   data-translate="profile.aboutMe">

                About Me

            </label>

            <textarea
                    id="bio"
                    rows="5"
                    data-translate-placeholder="profile.bioPlaceholder"
                    placeholder="Tell employers something about yourself..."></textarea>

        </div>


        <button
                type="submit"
                class="save-btn"
                data-translate="profile.saveChanges">

            Save Changes

        </button>


        <a
                href="#"
                id="backDashboardButton"
                class="back-dashboard"
                data-translate="common.backToDashboard">

            Back to Dashboard

        </a>


    </form>

</section>


<!-- PROFILE JAVASCRIPT -->

<script
        type="module"
        src="profile.js">
</script>


<!-- TRANSLATION SYSTEM -->

<script
        type="module"
        src="translations.js">
</script>


</body>

</html>
