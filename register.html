<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>KG Job Finder | Register</title>

    <link rel="stylesheet"
          href="register.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.googleapis.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<main class="register-page">

    <div class="overlay"></div>

    <section class="register-card">

        <div class="logo">

            <h1>KG</h1>

            <span>JOB FINDER</span>

        </div>


        <h2>Create Account</h2>

        <p>
            Create your free account to start your career.
        </p>


        <form id="registerForm">


            <!-- FULL NAME -->

            <div class="input-group">

                <label for="fullname">
                    Full Name
                </label>

                <input
                        type="text"
                        id="fullname"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                >

            </div>


            <!-- EMAIL -->

            <div class="input-group">

                <label for="email">
                    Email Address
                </label>

                <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                >

            </div>


            <!-- PHONE -->

            <div class="input-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                        autocomplete="tel"
                        required
                >

            </div>


            <!-- CITY -->

            <div class="input-group">

                <label for="city">
                    City
                </label>

                <input
                        type="text"
                        id="city"
                        placeholder="Enter your city"
                        autocomplete="address-level2"
                        required
                >

            </div>


            <!-- PASSWORD -->

            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <div class="password-box">

                    <input
                            type="password"
                            id="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            required
                    >

                    <button
                            type="button"
                            id="togglePassword"
                            class="eye-btn"
                            aria-label="Show password"
                    >

                        <i class="fa-solid fa-eye"></i>

                    </button>

                </div>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="input-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <div class="password-box">

                    <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                            required
                    >

                    <button
                            type="button"
                            id="toggleConfirmPassword"
                            class="eye-btn"
                            aria-label="Show password"
                    >

                        <i class="fa-solid fa-eye"></i>

                    </button>

                </div>

            </div>


            <!-- ACCOUNT TYPE -->

            <div class="input-group">

                <label for="accountType">
                    Account Type
                </label>

                <select
                        id="accountType"
                        required
                >

                    <option value="">
                        Select account type
                    </option>

                    <option value="candidate">
                        Candidate
                    </option>

                    <option value="employer">
                        Employer
                    </option>

                </select>

            </div>


            <!-- TERMS -->

            <label class="terms">

                <input
                        type="checkbox"
                        id="terms"
                        required
                >

                I accept the Terms & Conditions

            </label>


            <!-- CREATE ACCOUNT -->

            <button
                    type="submit"
                    class="register-btn"
            >

                Create Account

            </button>


            <!-- LOGIN -->

            <a
                    href="login.html"
                    class="login-link"
            >

                Back to Login

            </a>

        </form>

    </section>

</main>


<script
        type="module"
        src="register.js">
</script>

</body>

</html>
